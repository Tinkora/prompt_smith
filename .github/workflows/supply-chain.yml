name: Supply chain

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '37 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-audit:
    name: Rust dependency and workflow audit
    uses: Tinkora/.github/.github/workflows/reusable-supply-chain.yml@92df6f4d1a1f4d66fe605a0d30a81f3c2994ef99
    permissions:
      contents: read
    with:
      working-directory: .
      toolchain: 1.95.0

  npm-audit:
    name: npm dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: crates/prompt_smith_web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: crates/prompt_smith_web/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Audit production and development dependencies
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
